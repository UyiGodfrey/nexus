name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository information
        run: |
          echo "Repository validation started"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Validate required directories
        run: |
          test -d .github
          test -d app
          test -d docker
          test -d docs
          test -d infrastructure
          test -d scripts

      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/requirements/requirements.md
          test -f docs/architecture/system-architecture.md
          test -f docs/adr/ADR-001-project-architecture.md
          test -f docs/adr/ADR-002-cloud-platform.md
          test -f docs/adr/ADR-003-infrastructure-as-code.md
          test -f docs/adr/ADR-004-application-architecture.md

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Run application tests
        working-directory: app
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t nexus-api:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::417067938602:role/nexus-github-actions-role
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            nexus-api:${{ github.sha }} \
            417067938602.dkr.ecr.eu-west-1.amazonaws.com/nexus-api:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            417067938602.dkr.ecr.eu-west-1.amazonaws.com/nexus-api:${{ github.sha }}

      - name: Validate Git repository
        run: |
          git status
          git log -1 --oneline

      - name: CI completed
        run: echo "Repository validation passed."